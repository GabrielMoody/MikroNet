[SERVICE]
  Flush         1
  Log_Level     info
  Parsers_File  parser.conf

[INPUT]
  Name        tail
  Path        /var/log/app.log
  Parser      json
  Tag         mikronet-app

[OUTPUT]
  name        loki
  match       mikronet-app
  host        loki
  port        3100
  labels      app=mikronet-app
  label_keys  level,service
  drop_single_key true
  line_format json
